<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 78">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat&display=swap');
    ]]></style>
  </defs>
  <!-- Badge shadow (screen-space, not rotated) -->
  <circle cx="40" cy="43" r="30" fill="#2a2238"/>
  <!-- Rotated badge -->
  <g transform="rotate(-8 40 40)">
    <circle cx="40" cy="40" r="30" fill="#4ec3ff" stroke="#2a2238" stroke-width="4"/>
    <text x="40" y="52"
      text-anchor="middle"
      font-family="'Bagel Fat One', sans-serif"
      font-size="28"
      fill="#2a2238">S!</text>
  </g>
  <!-- Wordmark -->
  <text x="82" y="42"
    font-family="'Bagel Fat One', sans-serif"
    font-size="26"
    letter-spacing="-0.5"
    fill="#2a2238">Sticker Stop</text>
  <!-- Tagline -->
  <text x="82" y="61"
    font-family="'Caveat', cursive"
    font-size="15"
    fill="#2a2238"
    opacity="0.65">stick 'em everywhere ✨</text>
</svg>
