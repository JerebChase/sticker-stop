<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap');
    ]]></style>
  </defs>
  <!-- Shadow (screen-space, not rotated) -->
