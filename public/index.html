<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticker Stop ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper:   #fff7e3;
      --paper-2: #fff1cf;
      --ink:     #2a2238;
      --pink:    #ff4d8d;
      --yellow:  #ffd23f;
      --blue:    #4ec3ff;
      --mint:    #6ddc8a;
      --orange:  #ff8a3d;
      --purple:  #8b5cf6;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(circle at 1px 1px, rgba(42,34,56,0.08) 1px, transparent 1px);
      background-size: 22px 22px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .doodle-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .doodle { position: absolute; opacity: 0.55; }
    /* Sticker card: peel shadow + transition */
    .sticker {
      position: relative;
      background: white;
      border-radius: 18px;
      box-shadow:
        0 1px 0 rgba(0,0,0,0.05),
        0 6px 0 rgba(0,0,0,0.04),
        0 18px 28px -10px rgba(42,34,56,0.18);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    }
    button { font-family: inherit; }
    a { color: inherit; }

    /* Responsive layout helpers */
    .detail-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 36px;
      align-items: start;
    }
    .cart-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 32px;
      align-items: start;
    }
    .hiw-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      align-items: center;
    }
    @media (max-width: 900px) {
      .detail-grid { grid-template-columns: 1fr; }
      .cart-grid   { grid-template-columns: 1fr; }
      .hiw-grid    { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .detail-grid, .cart-grid { gap: 20px; }
    }

    /* Keyframe animations */
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
      50%       { transform: translateY(-6px) rotate(var(--rot, 0deg)); }
    }
    @keyframes pop {
      0%   { transform: scale(.7) rotate(-8deg); opacity: 0; }
      60%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes confetti-fall {
      0%   { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ─── Catalog ─────────────────────────────────────────────────────────────────

const STICKER_SETS = [

    sheetA: {

      name: "Cookie Crew",

    },
    sheetB: {

      blurb: "Karate kitten, hiking dog, milkshake mouse and a crayon-riding rascal — all snack time chaos.",
      highlights: ["Karate kitty", "Hiking dog", "Milkshake mouse", "Pig", "Crayon mouse", "Sprinkles"],
    },
  },
  {
    id: "castle",
    name: "Castle Quest",

    image: "/images/set-castle.png",
    sheetA: {
      id: "castle-a",

      blurb: "Brave knights, a wise wizard, a king & queen, and a couple of clanky castle guards.",
      highlights: ["Knights", "Wizard", "King & Queen", "Tank guards", "Castle tower", "Crown"],
    },
    sheetB: {
      id: "castle-b",

    sheetA: {

      highlights: ["Fluffy sheep", "Aliens", "Crop circles", "Crown", "Tin robot", "Barn"],

    sheetB: {

      highlights: ["Black sheep", "UFOs", "Crystal alien", "Lightning bug", "Pink critter", "Barn"],
    },

  {

    name: "Blast Off",

    color: "#8b5cf6",
    image: "/images/set-space.png",
    sheetA: {

    },
    sheetB: {

      highlights: ["Heavy rockets", "Mars rover", "Mars", "The Sun", "New space suit", "Lander"],
    },
  },

const PRICE_SHEET = 2;
const PRICE_PAIR  = 3;
const ROTS = [-2.5, 1.8, -1.4, 2.2, -2.0];

// ─── Routing ──────────────────────────────────────────────────────────────────

function getPage() {
  const hash = window.location.hash.replace("#", "") || "/";
  if (hash === "/" || hash === "") return { name: "list" };
  const m = hash.match(/^\/stickers\/(.+)$/);
  if (m) return { name: "detail", id: m[1] };
  if (hash === "/cart") return { name: "cart" };
  return { name: "list" };
}

// ─── Doodle background ────────────────────────────────────────────────────────

const DOODLES = [
  { top: "6%",  left: "4%",  rot: -12, type: "star",  color: "#ff4d8d", size: 38 },
  { top: "14%", left: "92%", rot:  18, type: "squig", color: "#4ec3ff", size: 60 },
  { top: "26%", left: "2%",  rot:   8, type: "dot",   color: "#ffd23f", size: 28 },
  { top: "42%", left: "96%", rot:  -8, type: "star",  color: "#8b5cf6", size: 28 },
  { top: "55%", left: "3%",  rot: -22, type: "squig", color: "#6ddc8a", size: 70 },
  { top: "70%", left: "94%", rot:  10, type: "dot",   color: "#ff8a3d", size: 36 },
  { top: "82%", left: "8%",  rot:   6, type: "star",  color: "#4ec3ff", size: 42 },
  { top: "90%", left: "88%", rot: -14, type: "squig", color: "#ff4d8d", size: 56 },
];

function DoodleLayer() {
  return (
    <div className="doodle-layer" aria-hidden>
      {DOODLES.map((d, i) => (
        <div key={i} className="doodle"
             style={{ top: d.top, left: d.left, "--rot": `${d.rot}deg`,
                      animation: `bob 6s ease-in-out ${i * 0.4}s infinite` }}>
          {d.type === "star" && (
            <svg width={d.size} height={d.size} viewBox="0 0 24 24" fill="none"
                 stroke={d.color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4 18.4 5.6" />
            </svg>
          )}
          {d.type === "squig" && (
            <svg width={d.size} height={d.size / 2} viewBox="0 0 60 30"
                 fill="none" stroke={d.color} strokeWidth="3.4" strokeLinecap="round">
              <path d="M2 18 Q 10 2, 18 18 T 34 18 T 58 18" />
            </svg>
          )}
          {d.type === "dot" && (
            <svg width={d.size} height={d.size} viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="6" fill={d.color} />
              <circle cx="12" cy="12" r="11" fill="none" stroke={d.color}
                      strokeWidth="1.5" strokeDasharray="2 3" />
            </svg>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── Logo ─────────────────────────────────────────────────────────────────────

function Logo({ onClick }) {
  return (
    <button onClick={onClick} style={{
      display: "inline-flex", alignItems: "center", gap: 10,
      background: "transparent", border: "none", cursor: "pointer", padding: 0,
    }}>
      <div style={{
        width: 48, height: 48, borderRadius: "50%",
        background: "var(--blue)", border: "4px solid white",
        boxShadow: "0 4px 0 rgba(0,0,0,0.12)",
        display: "grid", placeItems: "center",
        transform: "rotate(-8deg)", flexShrink: 0,
      }}>
        <span style={{ fontFamily: "'Bagel Fat One', cursive", color: "white", fontSize: 24, lineHeight: 1 }}>
          S!
        </span>
      </div>
      <div style={{ textAlign: "left", lineHeight: 1 }}>
        <div style={{ fontFamily: "'Bagel Fat One', cursive", fontSize: 28, color: "var(--ink)", letterSpacing: -0.5 }}>
          Sticker Stop
        </div>
        <div style={{ fontFamily: "'Caveat', cursive", fontSize: 16, color: "var(--ink)", opacity: 0.75, marginTop: 2 }}>
          stick 'em everywhere ✨
        </div>
      </div>
    </button>
  );
}

// ─── Header ───────────────────────────────────────────────────────────────────

function Header({ page, setPage, cartCount }) {
  return (
    <header style={{
      position: "relative", zIndex: 5,
      maxWidth: 1180, margin: "0 auto", padding: "24px 32px 16px",
      display: "flex", alignItems: "center", justifyContent: "space-between",
      gap: 16, flexWrap: "wrap",
    }}>
      <Logo onClick={() => setPage({ name: "list" })} />
      <nav style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <NavBtn active={page.name === "list"} onClick={() => setPage({ name: "list" })}>
          All Stickers
        </NavBtn>
        <NavBtn
          active={page.name === "cart"}
          onClick={() => setPage({ name: "cart" })}
          extraStyle={{
            background: "var(--yellow)", color: "var(--ink)",
            paddingRight: cartCount > 0 ? 54 : 18, position: "relative",
          }}
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="9" cy="20" r="1.4" /><circle cx="18" cy="20" r="1.4" />
            <path d="M2 3h3l3 13h12l2-9H6" />
          </svg>
          Cart
          {cartCount > 0 && (
            <span style={{
              position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)",
              background: "var(--ink)", color: "white",
              minWidth: 26, height: 26, borderRadius: 13, padding: "0 6px",
              display: "grid", placeItems: "center",
              fontFamily: "'Fredoka'", fontWeight: 700, fontSize: 13,
            }}>{cartCount}</span>
          )}
        </NavBtn>
      </nav>
    </header>
  );
}

function NavBtn({ children, active, onClick, extraStyle }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseDown={() => setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      style={{
        fontFamily: "'Fredoka'", fontWeight: 600, fontSize: 17,
        padding: "10px 18px", borderRadius: 999,
        border: "3px solid var(--ink)",
        background: active ? "var(--ink)" : "white",
        color: active ? "white" : "var(--ink)",
        cursor: "pointer",
        boxShadow: pressed ? "0 2px 0 rgba(42,34,56,0.85)" : "0 4px 0 rgba(42,34,56,0.85)",
        transform: pressed ? "translateY(2px)" : "translateY(0)",
        transition: "transform .08s, box-shadow .08s",
        display: "inline-flex", alignItems: "center", gap: 8,
        ...extraStyle,
      }}
    >{children}</button>
  );
}

// ─── BigButton ────────────────────────────────────────────────────────────────

function BigButton({ children, onClick, color = "var(--pink)", disabled, style }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      onMouseDown={() => !disabled && setPressed(true)}
      onMouseUp={() => setPressed(false)}
      onMouseLeave={() => setPressed(false)}
      style={{
        fontFamily: "'Fredoka'", fontWeight: 700, fontSize: 19,
        padding: "14px 28px", borderRadius: 999,
        border: "3px solid var(--ink)",
        background: disabled ? "#d8d2c4" : color,
        color: "white",
        cursor: disabled ? "not-allowed" : "pointer",
        boxShadow: pressed ? "0 2px 0 rgba(42,34,56,0.85)" : "0 6px 0 rgba(42,34,56,0.85)",
        transform: pressed ? "translateY(4px)" : "translateY(0)",
        transition: "transform .08s, box-shadow .08s",
        letterSpacing: 0.2,
        ...style,
      }}
    >{children}</button>
  );
}

// ─── PriceTag ─────────────────────────────────────────────────────────────────

function PriceTag({ amount, color = "var(--yellow)", rot = -6, size = "md" }) {
  const d = size === "lg"
    ? { fs: 30, pad: "8px 18px 8px 26px", hole: 10 }
    : { fs: 20, pad: "6px 14px 6px 20px", hole: 7 };
  return (
    <div style={{
      position: "relative", display: "inline-flex", alignItems: "center",
      background: color, color: "var(--ink)",
      border: "3px solid var(--ink)",
      borderRadius: "8px 28px 28px 8px",
      padding: d.pad,
      fontFamily: "'Bagel Fat One', cursive", fontSize: d.fs, lineHeight: 1,
      transform: `rotate(${rot}deg)`,
      boxShadow: "0 4px 0 rgba(42,34,56,0.85)",
      whiteSpace: "nowrap",
    }}>
      <span style={{
        position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)",
        width: d.hole * 2, height: d.hole * 2, borderRadius: "50%",
        background: "var(--paper)", border: "2px solid var(--ink)",
      }} />
      <span style={{ marginLeft: d.hole + 4 }}>${amount}</span>
    </div>
  );
}

// ─── Stepper ──────────────────────────────────────────────────────────────────

function Stepper({ value, onChange, min = 1, max = 99 }) {
  return (
    <div style={{
      display: "inline-flex", alignItems: "center",
      border: "3px solid var(--ink)", borderRadius: 999,
      background: "white", overflow: "hidden",
      boxShadow: "0 3px 0 rgba(42,34,56,0.85)",
    }}>
      <button onClick={() => onChange(Math.max(min, value - 1))} disabled={value <= min}
              style={{ fontFamily: "'Fredoka'", fontWeight: 700, fontSize: 22,
                       width: 38, height: 38, border: "none", background: "transparent",
                       cursor: value <= min ? "default" : "pointer",
                       color: "var(--ink)", opacity: value <= min ? 0.3 : 1 }}>−</button>
      <span style={{ fontFamily: "'Fredoka'", fontWeight: 700, fontSize: 18, minWidth: 32, textAlign: "center" }}>
        {value}
      </span>
      <button onClick={() => onChange(Math.min(max, value + 1))} disabled={value >= max}
              style={{ fontFamily: "'Fredoka'", fontWeight: 700, fontSize: 22,
                       width: 38, height: 38, border: "none", background: "transparent",
                       cursor: value >= max ? "default" : "pointer",
                       color: "var(--ink)", opacity: value >= max ? 0.3 : 1 }}>+</button>
    </div>
  );
}

// ─── Confetti ─────────────────────────────────────────────────────────────────

function Confetti({ active }) {
  const pieces = useMemo(() => Array.from({ length: 50 }, (_, i) => ({
    left: Math.random() * 100,
    delay: Math.random() * 0.6,
    duration: 2 + Math.random() * 1.6,
    color: ["#ff4d8d","#ffd23f","#4ec3ff","#6ddc8a","#ff8a3d","#8b5cf6"][i % 6],
    rot: Math.random() * 360,
    shape: i % 3,
    size: 8 + Math.random() * 8,
  })), []);
  if (!active) return null;
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 100 }}>
      {pieces.map((p, i) => (
        <div key={i} style={{
          position: "absolute", top: 0, left: `${p.left}%`,
          width: p.size, height: p.size,
          background: p.shape !== 2 ? p.color : "transparent",
          border: p.shape === 2 ? `3px solid ${p.color}` : "none",
          borderRadius: p.shape === 1 ? "50%" : 4,
          transform: `rotate(${p.rot}deg)`,
          animation: `confetti-fall ${p.duration}s ${p.delay}s linear forwards`,
        }} />
      ))}
    </div>
  );
}

// ─── CheckBadge ───────────────────────────────────────────────────────────────

function CheckBadge({ color }) {
  return (
    <div style={{
      position: "absolute", top: -14, right: -14,
      background: color, color: "white",
      border: "3px solid var(--ink)",
      borderRadius: "50%", width: 44, height: 44,
      display: "grid", placeItems: "center",
      boxShadow: "0 4px 0 rgba(42,34,56,0.85)",
      transform: "rotate(8deg)",
      animation: "pop .3s",
      zIndex: 2,
    }}>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12l5 5L20 7" />
      </svg>
    </div>
  );
}

// ─── SetCard (listing) ────────────────────────────────────────────────────────

function SetCard({ set, rot, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <div className="sticker" onClick={onClick}
         onMouseEnter={() => setHover(true)}
         onMouseLeave={() => setHover(false)}
         style={{
           cursor: "pointer", padding: 18, position: "relative",
           transform: `rotate(${hover ? 0 : rot}deg) translateY(${hover ? -8 : 0}px)`,
         }}>
      {/* Washi tape */}
      <div style={{
        position: "absolute", top: -10, left: "50%",
        transform: "translateX(-50%) rotate(-3deg)",
        width: 90, height: 22,
        background: `repeating-linear-gradient(45deg, ${set.color}, ${set.color} 8px, white 8px, white 16px)`,
        opacity: 0.85, borderRadius: 2,
        boxShadow: "0 2px 4px rgba(0,0,0,0.08)",
      }} />
      {/* Image */}
      <div style={{
        position: "relative", borderRadius: 14, overflow: "hidden",
        background: "var(--paper-2)", aspectRatio: "4 / 3",
      }}>
        <img src={set.image} alt={set.name}
             style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
        <div style={{ position: "absolute", top: 10, right: -6 }}>
          <PriceTag amount={`${PRICE_PAIR} pair`} color="var(--yellow)" rot={8} />
        </div>
        <div style={{ position: "absolute", top: 54, right: -6 }}>
          <PriceTag amount={`${PRICE_SHEET} sheet`} color="white" rot={-4} />
        </div>
      </div>
      {/* Body */}
      <div style={{ padding: "14px 4px 4px" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 4 }}>
          <h3 style={{ fontFamily: "'Bagel Fat One', cursive", margin: 0, fontSize: 26, lineHeight: 1, letterSpacing: -0.3 }}>
            {set.name}
          </h3>
          <span style={{
            background: set.color, color: "var(--ink)",
            fontFamily: "'Fredoka'", fontWeight: 600, fontSize: 12,
            padding: "3px 8px", borderRadius: 999, border: "2px solid var(--ink)",
            transform: "translateY(-2px)", display: "inline-block",
          }}>2 sheets</span>
        </div>
        <p style={{ margin: "6px 0 12px", fontSize: 15, lineHeight: 1.35, color: "var(--ink)", opacity: 0.8 }}>
          {set.tagline}
        </p>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "'Fredoka'", fontWeight: 600 }}>
          <span style={{ color: "var(--ink)", opacity: 0.7, fontSize: 14 }}>Pair deal · save $1</span>
          <span style={{
            background: "var(--ink)", color: "white",
            borderRadius: 999, padding: "8px 14px", fontSize: 14,
            display: "inline-flex", alignItems: "center", gap: 6,
          }}>See sheets <span style={{ fontSize: 18, lineHeight: 1 }}>→</span></span>
        </div>
      </div>
    </div>
  );
}

// ─── CartPage ─────────────────────────────────────────────────────────────────

function CartPage({ cart, updateQty, removeItem, setPage, clearCart }) {
  const [form, setForm] = useState({ name: "", email: "", address: "", notes: "" });
  const [showSuccess, setShowSuccess] = useState(false);
  const [confettiOn, setConfettiOn] = useState(false);
  const [lastOrder, setLastOrder] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const subtotal  = cart.reduce((s, it) => s + it.price * it.qty, 0);
  const itemCount = cart.reduce((s, it) => s + it.qty, 0);
  const shipping  = itemCount > 0 ? 1 : 0;
  const total     = subtotal + shipping;
  const canPlace  = cart.length > 0 && form.name.trim() && form.address.trim();

  const handlePlace = async (e) => {
    e.preventDefault();
    if (!canPlace || loading) return;
    setLoading(true);
    setError("");
    try {
      const res = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          customerName:    form.name.trim(),
          customerEmail:   form.email.trim(),
          customerAddress: form.address.trim(),
          customerNotes:   form.notes.trim(),
          items: cart, subtotal, shipping, total,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "Order failed");
      const order = {
        id: `SS-${data.orderId}`,
        placedAt: new Date().toISOString(),
        items: cart, customer: form, subtotal, shipping, total,
      };
      clearCart();
      setLastOrder(order);
      setShowSuccess(true);
      setConfettiOn(true);
      setTimeout(() => setConfettiOn(false), 3500);
    } catch (err) {
      setError(err.message || "Something went wrong — please try again.");
      setLoading(false);
    }
  };

  if (showSuccess && lastOrder) {
    return <SuccessPage order={lastOrder} setPage={setPage} confettiOn={confettiOn} />;
  }

  return (
    <main style={{ position: "relative", zIndex: 2, maxWidth: 1180, margin: "0 auto", padding: "8px 32px 80px" }}>
      <BackLink onClick={() => setPage({ name: "list" })}>← Keep shopping</BackLink>

      <h1 style={{ fontFamily: "'Bagel Fat One', cursive", fontSize: "clamp(40px, 5vw, 64px)", margin: "0 0 6px", letterSpacing: -1 }}>
        Your sticker stash
      </h1>
      <p style={{ fontFamily: "'Caveat', cursive", fontSize: 24, opacity: 0.8, margin: "0 0 26px" }}>
        {itemCount === 0
          ? "It's a little empty in here…"
          : `${itemCount} ${itemCount === 1 ? "item" : "items"} ready to ship`}
      </p>

      {cart.length === 0 ? (
        <EmptyCart setPage={setPage} />
      ) : (
        <div className="cart-grid">
          {/* Items column */}
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {cart.map((item) => (
              <CartItemCard key={item.sheetId} item={item} updateQty={updateQty} removeItem={removeItem} />
            ))}
          </div>

          {/* Checkout column */}
          <div style={{
            background: "white", border: "3px solid var(--ink)", borderRadius: 22,
            padding: 22, boxShadow: "0 8px 0 rgba(42,34,56,0.85)",
            position: "sticky", top: 20,
          }}>
            <h2 style={{ fontFamily: "'Bagel Fat One', cursive", fontSize: 24, margin: "0 0 14px" }}>
              Place your order
            </h2>
            <form onSubmit={handlePlace} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <Field label="Your name *"      value={form.name}    onChange={(v) => setForm({ ...form, name: v })}    placeholder="e.g. Sam Sticker" />
              <Field label="Email"            value={form.email}   onChange={(v) => setForm({ ...form, email: v })}   placeholder="optional, for updates" type="email" />
              <Field label="Mailing address *" value={form.address} onChange={(v) => setForm({ ...form, address: v })} placeholder="Street, city, zip" multiline />
              <Field label="Anything else?"   value={form.notes}   onChange={(v) => setForm({ ...form, notes: v })}   placeholder="Gift wrap? A drawing?" multiline />

              {error && (
                <div style={{
                  background: "#fef2f2", color: "#b91c1c",
                  border: "2px solid #fca5a5", borderRadius: 10,
                  padding: "10px 14px", fontFamily: "'Fredoka'", fontWeight: 600, fontSize: 14,
                }}>{error}</div>
              )}

              <div style={{
                marginTop: 8, padding: "14px 0 4px",
                borderTop: "2px dashed rgba(42,34,56,0.25)",
                display: "flex", flexDirection: "column", gap: 6,
              }}>
                <OrderRow label="Stickers" value={`$${subtotal}`} />
                <OrderRow label="Shipping" value={`$${shipping}`} />
                <OrderRow label="Total"    value={`$${total}`}    big />
              </div>

              <BigButton
                onClick={handlePlace}
                disabled={!canPlace || loading}
                color="var(--pink)"
                style={{ marginTop: 8, fontSize: 20, width: "100%", display: "flex", justifyContent: "center" }}
              >
                {loading ? "Placing order…" : "Place order →"}

              <p style={{ fontSize: 12.5, textAlign: "center", margin: 0, opacity: 0.7, fontFamily: "'Fredoka'" }}>
                No payment now! We'll get back to you to arrange it.
              </p>
            </form>
          </div>
        </div>
      )}
    </main>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────

function App() {
  const [page, setPageState] = useState(getPage);

  const setPage = (p) => {
    setPageState(p);
    const hash = p.name === "list" ? "#/" : p.name === "detail" ? `#/stickers/${p.id}` : "#/cart";
    if (window.location.hash !== hash) history.pushState(null, "", hash);
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  useEffect(() => {
    const handler = () => { setPageState(getPage()); window.scrollTo({ top: 0, behavior: "instant" }); };
    window.addEventListener("popstate", handler);
    return () => window.removeEventListener("popstate", handler);
  }, []);

  const [cart, setCart] = useState(() => {
    try { return JSON.parse(localStorage.getItem("sticker-stop-cart") || "[]"); }
    catch { return []; }
  });

  useEffect(() => { localStorage.setItem("sticker-stop-cart", JSON.stringify(cart)); }, [cart]);

  const addToCart = (item, qty = 1) =>
    setCart((prev) => {
      const idx = prev.findIndex((p) => p.sheetId === item.sheetId);
      if (idx >= 0) {
        const next = [...prev];
        next[idx] = { ...next[idx], qty: next[idx].qty + qty };
        return next;
      }
      return [...prev, { ...item, qty }];
    });

  const updateQty  = (sheetId, qty) => setCart((p) => p.map((i) => i.sheetId === sheetId ? { ...i, qty } : i));
  const removeItem = (sheetId)      => setCart((p) => p.filter((i) => i.sheetId !== sheetId));
  const clearCart  = ()             => setCart([]);
  const cartCount  = cart.reduce((s, it) => s + it.qty, 0);

  return (
    <div style={{ position: "relative", minHeight: "100vh" }}>
      <DoodleLayer />
      <div style={{ position: "relative", zIndex: 2 }}>
        <Header page={page} setPage={setPage} cartCount={cartCount} />

        {page.name === "list"   && <ListPage setPage={setPage} />}
        {page.name === "detail" && <DetailPage id={page.id} setPage={setPage} addToCart={addToCart} />}
        {page.name === "cart"   && (
          <CartPage cart={cart} updateQty={updateQty} removeItem={removeItem}
                    setPage={setPage} clearCart={clearCart} />
        )}

        <footer style={{
          maxWidth: 1180, margin: "20px auto 0", padding: "30px 32px 36px", textAlign: "center",
          fontFamily: "'Caveat', cursive", fontSize: 20, opacity: 0.6,
        }}>
          <div style={{ marginBottom: 6 }}>Made with stickers, by stickers, for stickers.</div>
          <div style={{ fontFamily: "'Fredoka'", fontWeight: 600, fontSize: 12, letterSpacing: 1, textTransform: "uppercase" }}>
            © Sticker Stop · 2026
          </div>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
