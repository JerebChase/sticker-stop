<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sticker Stop</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fff7e3;
    --paper-2: #fff1cf;
    --ink: #2a2238;
    --pink: #ff4d8d;
    --yellow: #ffd23f;
    --blue: #4ec3ff;
    --mint: #6ddc8a;
    --orange: #ff8a3d;
    --purple: #8b5cf6;
    --line: #f0c97a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,34,56,0.08) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: 0 0;
  }
  /* Floating doodles in the background */
  .doodle-layer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .doodle {
    position: absolute;
    opacity: 0.55;
    color: var(--ink);
  }
  /* Sticker card peel effect */
  .sticker {
    position: relative;
    background: white;
    border-radius: 18px;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.05),
      0 6px 0 rgba(0,0,0,0.04),
      0 18px 28px -10px rgba(42,34,56,0.18);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  }
  .sticker::before {
    /* Subtle die-cut white border feel */
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 14px;
    pointer-events: none;
  }
  button { font-family: inherit; }
  a { color: inherit; }

  /* Animations */
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
    50% { transform: translateY(-6px) rotate(var(--rot, 0deg)); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(var(--rot, 0deg)); }
    50% { transform: rotate(calc(var(--rot, 0deg) + 2deg)); }
  }
  @keyframes pop {
    0% { transform: scale(.7) rotate(-8deg); opacity: 0; }
    60% { transform: scale(1.08) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(-20vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
  }
  @keyframes float-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="pages.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
